name: Bug report
description: Something behaves differently from what the README says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. One request before you start: **please fill in the
        environment fields**. Every real bug found in these plugins so far depended on
        the environment, and the most instructive ones were invisible from reading the
        code. A report without versions and collation usually cannot be reproduced.

        If this is a **security** issue, please close this and email
        [security@mantek.io](mailto:security@mantek.io) instead.

  - type: dropdown
    id: plugin
    attributes:
      label: Which plugin?
      options:
        - wp-arabic-search
        - wp-arabic-slug-schema-guard
        - wp-ses-mail
        - wp-fleet-cron
        - not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Plugin version
      description: The `Version:` line in the plugin file header, e.g. 0.9.3.
      placeholder: "0.9.3"
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: What happened, and what you expected instead
      description: If a search returned the wrong results, give the exact search term. Arabic is fine, paste it as-is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Fill in what applies. The collation matters more often than people expect, and
        for wp-arabic-search the FULLTEXT token size decides whether short words can
        match at all.
      value: |
        - WordPress:
        - PHP:
        - MySQL / MariaDB:            (SELECT VERSION();)
        - Collation of wp_posts:      (SHOW FULL COLUMNS FROM wp_posts LIKE 'post_title';)
        - Table prefix:               (if not the default wp_)
        - Multisite:                  (yes / no)
        - Host or local rig:          (e.g. LocalWP, Docker, EC2, managed host)
        - innodb_ft_min_token_size:   (wp-arabic-search only: SELECT @@innodb_ft_min_token_size;)
    validations:
      required: true

  - type: textarea
    id: cli
    attributes:
      label: WP-CLI output
      description: |
        If the plugin ships a status command, paste it, including the exit code. For
        wp-arabic-search, `wp arabic-search explain "<your term>"` usually answers
        "why did this not match?" on its own, so paste that too if the issue is a search
        result.
      render: shell
      placeholder: |
        $ wp arabic-search status
        …

  - type: textarea
    id: log
    attributes:
      label: Anything in debug.log?
      description: Notices, warnings or fatals from the plugin, with `WP_DEBUG_LOG` on.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I am on the latest release of the plugin.
          required: false
        - label: I have read the "Known limits" section of the README, and this is not one of them.
          required: false
